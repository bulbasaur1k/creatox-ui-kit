<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font:
          12px/1.45 system-ui,
          sans-serif;
        color: #111;
      }
      p {
        margin: 0 0 8px;
      }
      textarea {
        width: 100%;
        height: 140px;
        box-sizing: border-box;
        font:
          11px/1.4 ui-monospace,
          monospace;
        border: 1px solid #c8c8c8;
        border-radius: 4px;
        padding: 6px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #c8c8c8;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      #log {
        white-space: pre-wrap;
        font:
          11px/1.4 ui-monospace,
          monospace;
        color: #444;
        max-height: 160px;
        overflow: auto;
        border-top: 1px solid #eee;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <p>
      Вставьте содержимое <code>figma/tokens.figma.json</code> или выберите файл. Токены
      станут переменными коллекции «creatox-ui-kit» с режимами Light и Dark, размеры
      текста — текстовыми стилями. Повторный запуск обновляет значения, а не дублирует.
    </p>
    <div class="row">
      <input id="file" type="file" accept=".json,application/json" />
      <label><input id="styles" type="checkbox" checked /> текстовые стили</label>
    </div>
    <textarea id="json" placeholder='{"tokens": […]}'></textarea>
    <div class="row">
      <button id="run" class="primary">Импортировать</button>
      <span id="status"></span>
    </div>
    <div id="log"></div>
    <script>
      const json = document.getElementById('json')
      const file = document.getElementById('file')
      const run = document.getElementById('run')
      const status = document.getElementById('status')
      const log = document.getElementById('log')

      file.addEventListener('change', async () => {
        const [chosen] = file.files
        if (chosen) json.value = await chosen.text()
      })

      run.addEventListener('click', () => {
        let data
        try {
          data = JSON.parse(json.value)
        } catch (error) {
          status.textContent = 'Это не JSON: ' + error.message
          return
        }
        run.disabled = true
        status.textContent = 'Импортирую…'
        log.textContent = ''
        parent.postMessage(
          {
            pluginMessage: {
              type: 'import',
              tokens: data.tokens ?? data,
              textStyles: document.getElementById('styles').checked,
            },
          },
          '*',
        )
      })

      window.onmessage = (event) => {
        const message = event.data.pluginMessage
        if (!message) return
        if (message.type === 'log') log.textContent += message.text + '\n'
        if (message.type === 'done') {
          run.disabled = false
          status.textContent = message.text
        }
      }
    </script>
  </body>
</html>
