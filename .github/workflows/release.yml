name: Release

# Publishing is driven by a tag, so the released version is always the one
# recorded in git. Tag with `npm version <patch|minor|major> && git push --follow-tags`.
#
# Bun installs, npm publishes. Not an oversight: the provenance attestation is
# produced by the npm CLI through OIDC and Sigstore, and `bun publish` does not
# issue one. Losing a signed link between the tarball and the commit that built
# it would be a worse trade than the few seconds npm costs here.
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Fail if the tag does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
